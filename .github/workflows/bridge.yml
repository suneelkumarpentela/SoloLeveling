name: telegram-bridge

# Times are UTC. Suneel is IST (UTC+5:30).
#   23:30 UTC = 05:00 IST  -> morning: score yesterday, build + send today's list
#   13:30 UTC = 19:00 IST  -> evening: re-send today's list, read-only
#
# These are shifted 3 hours earlier than the actual intended 08:00/22:00 IST
# delivery times. GitHub's schedule trigger has no delivery-time guarantee,
# and in practice both crons were landing 1-3.5 hours late here, worse for
# the morning slot - likely because :00/:15/:30/:45 are the most congested
# minutes on GitHub's shared scheduler, and 02:30 UTC overlaps a lot of
# globally busy hours. Shifting earlier means a late arrival lands close to
# the real target instead of hours past it; an on-time arrival just lands a
# bit early, which is the preferred failure direction here.
#
# IMPORTANT: the morning and evening jobs below are gated with `if:` on
# github.event.schedule (or the workflow_dispatch mode input) so that only
# ONE of them ever runs for a given trigger. Notion's read-modify-write is not
# atomic, so if both jobs ran unconditionally on every trigger they would run
# in parallel within the same workflow run and race on the same page.
on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which cycle to run'
        required: true
        default: morning
        type: choice
        options:
          - morning
          - evening

# Belt-and-braces: even with the if: gates above, this also serialises any
# overlapping trigger (e.g. a manual dispatch fired while a scheduled run is
# still in progress) so two runs can never mutate the offset or the Notion
# page at once.
concurrency:
  group: telegram-bridge
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: telegram-bridge

jobs:
  morning:
    if: >-
      github.event.schedule == '30 23 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'morning')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet requests

      - name: Fetch Telegram replies into Notion
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: python scripts/fetch_updates.py

      - name: Score yesterday, build today, queue morning message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: python scripts/process_replies.py morning

      - name: Send queued messages to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: python scripts/send_outbox.py

      - name: Commit offset if it changed
        run: |
          if [[ -n "$(git status --porcelain state/offset.json)" ]]; then
            git config user.name  "telegram-bridge[bot]"
            git config user.email "actions@github.com"
            git add state/offset.json
            git commit -m "chore: advance telegram offset [skip ci]"
            git push
          else
            echo "offset unchanged"
          fi

  evening:
    if: >-
      github.event.schedule == '30 13 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'evening')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet requests

      - name: Fetch Telegram replies into Notion
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: python scripts/fetch_updates.py

      - name: Re-send today's checklist (read-only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: python scripts/process_replies.py evening

      - name: Send queued messages to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: python scripts/send_outbox.py

      - name: Commit offset if it changed
        run: |
          if [[ -n "$(git status --porcelain state/offset.json)" ]]; then
            git config user.name  "telegram-bridge[bot]"
            git config user.email "actions@github.com"
            git add state/offset.json
            git commit -m "chore: advance telegram offset [skip ci]"
            git push
          else
            echo "offset unchanged"
          fi
