name: telegram-bridge

# Times are UTC. Suneel is IST (UTC+5:30).
#   02:00 UTC = 07:30 IST  -> pull overnight replies BEFORE the 7:45 Cowork run
#   02:30 UTC = 08:00 IST  -> send the morning checklist
#   16:30 UTC = 22:00 IST  -> send the evening checklist
#
# Every run does fetch-then-send. Both steps are idempotent (offset-based /
# sent-flag-based), so an extra or delayed run is harmless and self-healing.
on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '30 2 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:

# Never let two runs mutate the offset or the Notion page at once.
concurrency:
  group: telegram-bridge
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet requests

      - name: Fetch Telegram replies into Notion
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: python scripts/fetch_updates.py

      - name: Send queued messages to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: python scripts/send_outbox.py

      - name: Commit offset if it changed
        run: |
          if [[ -n "$(git status --porcelain state/offset.json)" ]]; then
            git config user.name  "telegram-bridge[bot]"
            git config user.email "actions@github.com"
            git add state/offset.json
            git commit -m "chore: advance telegram offset [skip ci]"
            git push
          else
            echo "offset unchanged"
          fi
